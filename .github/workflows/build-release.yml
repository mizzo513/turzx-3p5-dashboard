name: Build and publish TURZX Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'version_info.py'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Check Python sources
        shell: pwsh
        run: |
          python -m compileall -q .

      # Includes V3.9.7 reconnect and clock-crop tests; release only after green CI.
      - name: Run GUI, official rail, weather, layout and updater regressions
        shell: pwsh
        run: |
          python -m pip install pillow pyserial
          python -X utf8 -m unittest discover -v -p "tests_*.py"
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

      - name: Build EXE and offline update ZIP
        shell: pwsh
        run: |
          python tools/build_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          if (-not (Test-Path 'dist/TURZX_3p5_Dashboard.exe')) { throw 'Missing EXE' }

      - name: Smoke-test frozen EXE startup on Windows
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/TURZX_3p5_Dashboard.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          if (-not $proc.WaitForExit(60000)) {
            $proc.Kill()
            throw 'EXE smoke test timed out before startup completed'
          }
          if ($proc.ExitCode -ne 0) {
            throw "EXE startup smoke test failed with exit code $($proc.ExitCode)"
          }
          Write-Host 'Frozen EXE startup smoke test successful'

      - name: Integration-test updater EXE replacement and restart
        shell: pwsh
        run: |
          Write-Host 'Windows PowerShell updater helper smoke test (including SHA256 validation)'
          python -X utf8 tools/test_updater_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Updater integration failed; release aborted' }

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (python -c 'from version_info import APP_VERSION; print(APP_VERSION)').Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid APP_VERSION' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TURZX-Windows-build-v${{ steps.version.outputs.version }}
          path: |
            dist/TURZX_3p5_Dashboard.exe
            dist/TURZX_Update_v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:APP_VERSION"
          $zip = "dist/TURZX_Update_$tag.zip"
          $exe = 'dist/TURZX_3p5_Dashboard.exe'
          if (-not (Test-Path $zip)) { throw "Missing update ZIP: $zip" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Bump APP_VERSION before publishing a new version."
          }
          gh release create $tag $exe $zip --target $env:GITHUB_SHA --title $tag --notes "TURZX 3.5 dashboard $tag, Windows x64. The update ZIP contains manifest.json and the EXE." --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
