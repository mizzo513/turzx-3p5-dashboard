name: Check official rail-status text compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: windows-latest
    steps:
      - name: Checkout parser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read public IR and JR summaries
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -X utf8 -c "from rail_official_status import fetch_official_rail_notice; n=fetch_official_rail_notice(); print('IR',n.ir.state,'七尾線',n.nanao.state,'DISPLAY',n.text)"
