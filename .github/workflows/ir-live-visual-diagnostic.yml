name: IR live screen-data comparison (diagnostic branch only)
on:
  push:
    branches:
      - ir-live-visual-diagnostic-20261125
    paths:
      - '.github/workflows/ir-live-visual-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated diagnostic code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install browser and OCR
        shell: bash
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq tesseract-ocr
      - name: One-shot public live comparison (no site mutation)
        shell: bash
        run: |
          python diagnostics/ir_visual_test.py
      - name: Upload timestamped public-page screenshot and result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ir-live-visual-data
          path: ir-capture/
          retention-days: 7
